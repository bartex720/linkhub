<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LinkHub — seus links em um só lugar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="profile-card">
      <div class="avatar">LH</div>
      <!-- EDITE AQUI: nome, descrição e links de exemplo -->
      <h1>Seu Nome</h1>
      <p class="bio">Minha página com todos os meus links.</p>

      <div class="topic">
        <h2>🌐 Redes e projetos</h2>
        <a class="link-button" href="https://example.com" target="_blank">Meu site</a>
        <a class="link-button" href="https://github.com" target="_blank">GitHub</a>
      </div>

      <div class="topic">
        <h2>📌 Mais conteúdo</h2>
        <p class="text-block">Você pode colocar textos explicativos entre os botões.</p>
        <a class="link-button" href="https://example.com" target="_blank">Outro link</a>
      </div>

      <a class="login-link" href="login.html">Entrar / criar conta</a>
    </section>
  </main>
</body>
</html>
